<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040c11">
<meta name="description" content="Noösphere — an immersive, multilingual library of sacred texts. Books in English, Romanian, and Chinese.">
<title>Noösphere — The Living Scriptorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&family=Noto+Serif+SC:wght@400;500&family=Noto+Serif+Hebrew:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/site-mark.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body data-scene="archive">
<div class="grain" aria-hidden="true"></div>
<div class="site-mark" id="brandRoot" role="button" tabindex="0" aria-label="Return to the archive">
 <span class="sigil" aria-hidden="true"><img src="assets/site-mark.svg" alt="" width="40" height="40"></span>
 <span><small>THE LIVING SCRIPTORIUM</small><strong>NOÖSPHERE <span class="site-mark-dot">✦</span></strong></span>
</div>
<main id="main">
<section class="scene current" id="archive" aria-label="Immersive archive">
 <div class="archive-environment" aria-hidden="true"></div><div class="atmosphere-mask" aria-hidden="true"></div>
 <div class="background-mesh" aria-hidden="true"></div>
 <canvas id="particles" aria-hidden="true"></canvas>
 <svg id="neuralCanopy" class="neural-canopy" viewBox="0 0 1000 630" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
 <div class="archive-poem"><h1>Every word<br>is a <em>symbol.</em></h1><h2>Esoteric light technology of the ancient wisdom.</h2><p>Many waves in a living field<br>of knowledge and form.</p></div>
 <div id="floatingArchive" class="floating-archive" aria-label="Floating crystalline books. Scroll to explore; select to open."></div>
 <div class="archive-active" id="activeBook" aria-live="polite"></div>
 <div class="archive-sequence" id="archiveSequence" aria-label="Choose a volume"></div>
 <div class="archive-instruction"><span class="instruct-diamond">◇</span><span>SCROLL TO TRACE THE FIELD</span><span class="instruct-diamond">◇</span></div>
 <div class="archive-status"><span>THE COLLECTION</span><strong id="archiveIndex">01 <i>/ 04</i></strong></div>
 <form class="archive-search" id="bookSearchForm" role="search" autocomplete="off">
  <label class="visually-hidden" for="bookSearch">Search books or authors</label>
  <input type="search" id="bookSearch" placeholder="Search books or authors" aria-controls="bookSearchResults" spellcheck="false">
  <ul id="bookSearchResults" class="search-results" aria-label="Matching books" hidden></ul>
  <span id="searchStatus" class="visually-hidden" role="status"></span>
 </form>
</section>

<section class="scene" id="details" aria-label="Selected book details" hidden>
 <div class="detail-atmosphere" aria-hidden="true"></div>
 <div class="background-mesh" aria-hidden="true"></div>
 <div class="detail-waves" aria-hidden="true"></div>
 <button id="detailsReturn" class="back-gesture"><span>←</span> RETURN TO THE FIELD</button>
 <div class="detail-shell">
  <div class="detail-exhibit"><div class="detail-crown" id="detailCrown"></div><div class="detail-volume" id="detailVolume"></div><div class="detail-base"><span class="base-orbit"></span><span id="detailCaption"></span> <span class="base-orbit"></span></div></div>
  <article class="detail-text" id="detailText"></article>
 </div>
 <div class="detail-footer"><span>ARCHIVE / THE CHOSEN VOLUME</span><span>02 — DECODE THE TEXT</span></div>
</section>

</main>
<script src="catalog.js" defer></script>
<script src="glyphs.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
